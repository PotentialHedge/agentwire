[workspace]
members = [".", "participant"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agentwire = { path = "participant", default-features = false }
axum = { version = "0.8", default-features = false }
base64 = "0.23"
form_urlencoded = "1"
getrandom = "0.4"
http-body-util = "0.1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"

[package]
name = "agentwire-relay"
version.workspace = true
edition.workspace = true

[lib]
path = "relay/lib.rs"

[[bin]]
name = "agentwire-relay"
path = "relay/main.rs"

[dependencies]
agentwire.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
base64.workspace = true
form_urlencoded.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["json"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
agentwire = { workspace = true, features = ["client"] }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
